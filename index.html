<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <div class="header">
            <h2>Погода</h2>
            <button class="refresh" id="refreshBtn">↻</button>
        </div>

        <div class="cities" id="citiesList"></div>
        
        <button class="add-btn" id="addCityBtn">+ Добавить город</button>

        <div id="weatherBlock"></div>

        <div class="modal hidden" id="cityModal">
            <div class="modal-content">
                <h3>Новый город</h3>
                <input type="text" id="cityInput" placeholder="Введите город">
                <div class="suggestions hidden" id="suggestions"></div>
                <div class="error hidden" id="cityError"></div>
                <div class="modal-btns">
                    <button class="btn" id="submitCity">Добавить</button>
                    <button class="btn cancel" id="cancelModal">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
